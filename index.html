<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Countdown Timer</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Background Video -->
    <video autoplay muted loop src="25380-350507864_tiny.mp4"></video>

    <!-- Input for countdown duration -->
    <div class="input-container">
        <input type="number" id="daysInput" placeholder="Days" min="0" max="99.99">
        <input type="number" id="hoursInput" placeholder="Hours" min="0" max="23">
        <input type="number" id="minutesInput" placeholder="Minutes" min="0" max="59">
        <input type="number" id="secondsInput" placeholder="Seconds" min="0" max="59">
    </div>
    <button id="startButton" class="button">Start Countdown</button>
    <!-- Timer Display -->
    <div class="container">
        <div class="container_items">
            <div class="segment-title">Days</div>
            <div class="op_items">
                <div class="flip-card" data-days-tens>
                    <div class="top">0</div>
                    <div class="bottom">0</div>
                </div>
                <div class="flip-card" data-days-ones>
                    <div class="top">0</div>
                    <div class="bottom">0</div>
                </div>
            </div>
        </div>
        <div class="container_items">
            <div class="segment-title">Hours</div>
            <div class="op_items">
                <div class="flip-card" data-hours-tens>
                    <div class="top">0</div>
                    <div class="bottom">0</div>
                </div>
                <div class="flip-card" data-hours-ones>
                    <div class="top">0</div>
                    <div class="bottom">0</div>
                </div>
            </div>
        </div>
        <div class="container_items">
            <div class="segment-title">Minutes</div>
            <div class="op_items">
                <div class="flip-card" data-minutes-tens>
                    <div class="top">0</div>
                    <div class="bottom">0</div>
                </div>
                <div class="flip-card" data-minutes-ones>
                    <div class="top">0</div>
                    <div class="bottom">0</div>
                </div>
            </div>
        </div>
        <div class="container_items">
            <div class="segment-title">Seconds</div>
            <div class="op_items">
                <div class="flip-card" data-seconds-tens>
                    <div class="top">0</div>
                    <div class="bottom">0</div>
                </div>
                <div class="flip-card" data-seconds-ones>
                    <div class="top">0</div>
                    <div class="bottom">0</div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
